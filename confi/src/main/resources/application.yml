spring:
  application:
    name: confi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confi}
    username: ${DB_USERNAME:confi}
    password: ${DB_PASSWORD:confi}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info