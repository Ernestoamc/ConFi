spring:
  application:
    name: confi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confi}
    username: ${DB_USERNAME:confi}
    password: ${DB_PASSWORD:confi}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  events:
    kafka:
      enabled: ${KAFKA_EVENTS_ENABLED:false}
      topic: ${KAFKA_EVENTS_TOPIC:confi.events}
      group-id: ${KAFKA_EVENTS_GROUP_ID:confi.notification.local}
    reminders:
      enabled: ${REMINDER_EVENTS_ENABLED:true}
      days-ahead: ${REMINDER_DAYS_AHEAD:3}
      max-days-ahead: ${REMINDER_MAX_DAYS_AHEAD:15}
      high-amount-threshold: ${REMINDER_HIGH_AMOUNT_THRESHOLD:1000}
      cron: ${REMINDER_CRON:0 0 8 * * *}
