spring:
  application:
    name: confi

  datasource:
    url: jdbc:postgresql://localhost:5432/confi
    username: confi
    password: confi

  jpa:
    hibernate:
      ddl-auto: validate   # el schema lo maneja Flyway, no Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info